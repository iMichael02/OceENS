[project]
name = "oceens"
version = "0.1.0"
description = "Plateforme d'évaluation des enseignements pour l'EPF"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",         # Routes, réponses (main.py, auth.py)
    "sqlmodel==0.0.39",         # Session, SQLModel, Field, select (database.py, models/)
    "sqlalchemy==2.0.52",       # Column, ForeignKey, Integer, String (database.py, models/)
    "uvicorn==0.52.4",          # Serveur ASGI pour lancer l'application
    "pydantic==2.13.4",         # BaseModel pour la validation des données
    "starlette==1.6.0",         # SessionMiddleware pour la gestion des sessions
    "python-dotenv==1.2.3",     # load_dotenv pour charger les variables d'environnement
    "requests==2.34.2",         # Appels à l'API Microsoft Graph (auth.py)
    "msal==1.38.0",             # Authentification Microsoft Entra ID
    "openpyxl==3.1.5",          # load_workbook pour l'import d'étudiants via Excel
    "python-multipart==0.0.32", # Requis par FastAPI pour Form et UploadFile
    "jinja2==3.1.6",            # Requis par FastAPI pour Jinja2Templates
    "itsdangerous==2.2.0",      # Requis par Starlette pour SessionMiddleware
    "pandas==3.0.5",            # Agrégation des données et export CSV
    "requests-cache==1.3.3",    # Mise en cache des requêtes LLM
    "markdown-it-py==4.2.0",    # Rendu du markdown des synthèses LLM en HTML
]

[project.scripts]
oceens = "oceens.main:run"
oceens-summaries-daemon = "oceens.summaries_generator_daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oceens"]
