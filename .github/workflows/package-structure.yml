name: package-structure

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Private names crossing a package boundary
        run: uv run tach check
      - name: Import cycles between packages
        run: uv run python scripts/check_cycles.py
