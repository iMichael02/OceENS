name: Architecture

# The check and the tests run on every push and every pull request. A push to
# the default branch whose two jobs pass is then deployed to staging. Production
# is only reached by a promotion: a run started by hand (workflow_dispatch) that
# deploys the image of staging's last green deploy and builds nothing.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  architecture:
    name: architecture
    # A promotion builds nothing, so it has nothing to check.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run tach check
      - run: uv run python scripts/check_cycles.py

  test:
    name: test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run pytest

  # On a push to the default branch alone, once `architecture` and `test` have
  # both passed. The GitHub Environments accept deploys from that branch only.
  deploy-staging:
    name: deploy to staging
    needs: [architecture, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/course-2026-fallback-clean-bench'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # One deploy at a time per environment, in the order pushed.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7.0.1

      # One image per commit, tagged with it, so that whatever runs can be
      # traced to the run that passed. A commit pushed twice is built once.
      # REVISION is the commit again, inside the image: the app sends it back
      # in an X-Revision header, so the deploy can tell which image answered.
      - name: Build and push the image, unless it exists
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image already built"
          else
            docker build \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --build-arg "REVISION=$GITHUB_SHA" \
              -t "$image" .
            docker push "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the image to staging
        uses: ./.github/actions/deploy-to-app-service
        with:
          image: ${{ steps.image.outputs.image }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          secret-key: ${{ secrets.SECRET_KEY }}
          dev-login-key: ${{ secrets.DEV_LOGIN_KEY }}
          mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}
          provider-base-url: https://api.mistral.ai/v1
